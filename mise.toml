# リポジトリ保守用のタスク。`mise tasks` で一覧を表示し、`mise run <タスク名>` で実行する。
# セットアップ（init.command / setup.command）は mise のインストール前に実行するため、ここには定義しない。

[tasks."brew:deps:show"]
description = "Homebrew の依存関係をツリー形式で表示する"
run = "brew deps --installed --tree"

# 生成される Brewfile をベースに bin/.Brewfile を最新化する。
[tasks."brew:dump"]
description = "インストール済みパッケージを Brewfile に書き出す"
run = ["rm -rf Brewfile", "brew bundle dump"]

[tasks."vscode:ext:list"]
description = "VSCode 拡張のリストを vscode/extensions に書き出す"
run = "code --list-extensions > vscode/extensions"

# profile は crit と git の実行ファイルの場所と、動作に要る権限に依存する。
# Claude Code の sandbox の中では sandbox-exec を入れ子にできず、スキップされる。
[tasks."crit:profile-test"]
description = "cc-crit の profile のテストを実行する（sandbox の外で。crit・git・macOS を更新したら実行する）"
run = "/usr/bin/python3 -B claude/hooks/tests/test-cc-crit-profile.py"

# スキル・プラグインを足した・外した・更新したら check を実行し、違いがあれば /sync-skill-docs で文書を直す。
# 手順は claude/SKILL_INVENTORY.md の「更新したときの見直し」にある。
[tasks."claude:skills-check"]
description = "入っているスキルを、スナップショットとスキルの文書に照合する（終了コード 0: 違いなし、1: 違いあり、2: 照合できない）"
run = "/usr/bin/python3 -B claude/scripts/skills-check.py check"

[tasks."claude:skills-snapshot"]
description = "今のスキルの状態を claude/skills-snapshot.json に書く（文書を合わせた後に、通常のターミナルで実行する。sandbox の中からは claude/ に書けない）"
run = "/usr/bin/python3 -B claude/scripts/skills-check.py snapshot"

[tasks."claude:skill-usage"]
description = "期間内のスキルの使われ方を集計する（例: mise run claude:skill-usage 2026-11-16 2026-12-07）"
run = "/usr/bin/python3 -B claude/scripts/skill-usage.py"

# 読み取りだけで、消すためのコマンドは出力するだけ。実行は人間が、Claude Code をすべて閉じてから通常のターミナルで行う。
# スクリプトは候補があると終了コード 1 を返す。mise が失敗と表示しないよう 1 は成功として扱い、点検できないとき（2）だけ失敗にする。
[tasks."claude:trust-audit"]
description = "Claude Code が信頼したフォルダを点検し、消す候補があれば次の手順とコマンドを出す（点検できないときだけ失敗する）"
run = "/usr/bin/python3 -B claude/scripts/trust-audit.py || [ $? -eq 1 ]"

# スキル・プラグインをまとめて更新する。sandbox の中からは ~/.claude と Homebrew に書けないので、通常のターミナルで実行する。
# Claude Code の ! は、セッションによっては sandbox の中で動き、更新も profile のテストも失敗する。
# ! で実行するときは、mise を通さず /bin/bash ~/dotfiles/claude/scripts/update-skills.sh で実行する。
# mise は dotfiles のルートの設定ファイル（mise.local.toml など）を読み込み、ルートには sandbox から書けるため。
# paranoid で、信頼されていない設定は読み込まれないが、念のため mise を通さない。
# 終わったら、Claude Code を再起動する前に /sync-skill-docs で文書と hooks を見直す。
[tasks."claude:update"]
description = "gstack・プラグイン・crit の CLI を更新し、gstack が settings.json に書いた絶対パスを ~/ に戻し、modern-web-guidance の新しい版を知らせる（ターミナルで実行する）"
run = "/bin/bash claude/scripts/update-skills.sh"

# mise で管理するツールのグローバル バージョンを指定する。
# ~/.config/mise/config.toml として使用されるもの。
# https://mise.jdx.dev/configuration.html#global-config-config-mise-config-toml
[tools]
# sf の依存が pino 10 系に移ったり、9.14.0 以外を使うようになると、この行は何にも当てはまらなくなる。
# 定期的に次のコマンドで確認し、結果に 9.14.0 がなければ、trust_policy_excludes を削除すること。
# find "$(mise where npm:@salesforce/cli)" -path '*/node_modules/pino/package.json' -exec grep -H '"version"' {} +
"npm:@salesforce/cli" = { version = "latest", trust_policy_excludes = [
  "pino@9.14.0",
] }
# Web 標準の書き方のガイド（スキル modern-web-guidance・chrome-extensions）の CLI。スキルと同じ版にそろえる。
# 新しい版は update-skills.sh が知らせる。上げるときは、作業ブランチで claude/scripts/update-modern-web-guidance.py --apply を実行し、スキルと一緒に書き換える（手で上げない）。
"npm:modern-web-guidance" = "1.0.1"
# AI エージェントのスキル・プラグインを、入れる前に検査する。
# 依存の yara-python には Python 3.14 以降の wheel がなく、ソースからのビルドが失敗しうるので、3.13 を指定する。
# Git から入れると依存のハッシュを lockfile に残せないので、版を固定する。上げる前に mise ls-remote 'pypi:NVIDIA/SkillSpector' で確かめる。
"pypi:NVIDIA/SkillSpector" = { version = "v2.13.6", python = "3.13" }
aws-cli = { version = "latest", symlink_bins = "true" }
# インストール後に biome/biome.jsonc の $schema URL のバージョンを自動で一致させる。
# ~/.config/mise/config.toml はこのファイルへの symlink なので、実体をたどって dotfiles の場所を特定する。
# MISE_CONFIG_FILE は `mise install biome@x` のようにバージョンを明示すると空になるため使わない。
biome = { version = "latest", postinstall = 'bash "$(dirname "$(readlink -f "$HOME/.config/mise/config.toml")")/../biome/sync_schema.sh"' }
go = "1.27.4"
# JSON データの加工／整形コマンド。 sf:plugins タスクでも使用する。
jq = "latest"
node = "26.13.1"
pnpm = "latest"
python = "3.15.2"
ruby = "4.0.10"
ruff = "latest"
terraform = "1.17.2"
uv = "latest"
# VSCode 用 Apex拡張が Java 21 に依存しているので、ここで指定する。詳細は ./JAVA.md を参照。
java = "temurin-21"

# スクリプトの実体は config/sf/sync-plugins.sh 。 config/link.sh でリンクする。
[tasks."sf:plugins"]
description = "Salesforce CLI のプラグインを ~/.config/sf/plugins.txt に同期する"
run = '"$HOME/.config/sf/sync-plugins.sh"'

# プロジェクトの設定（config）と、_.source などが読むファイル（env_files）を、パスではなく中身で信頼する。
# 中身が変わったら、人間が中身を確かめて `mise trust <ファイル>` するまで読み込まない（docs/work/20261116_sandbox-path-gaps）。
# plugins・provenance は入れない。npm:@salesforce/cli のインストールを止める見込みのため。
# provenance は lockfile（mise.lock）の改ざんへの備えにもなる見込みだが、確かめていない（次の作業で扱う）。
[settings]
paranoid = ["config", "env_files"]

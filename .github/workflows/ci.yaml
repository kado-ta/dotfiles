name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# main への push は、コミットごとの group にして取り消し合わない。どの push の run も最後まで動かし、
# hook-tests を壊した push を特定できるようにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.33.1
      ZIZMOR_SHA256: 3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版を固定し、チェックサムを確かめてから使う。手元（Homebrew）の版と違うと check-repo.py の tool-versions が失敗する。
      # 手元が上がったら、別の PR で版と SHA256 を一緒に上げる。SHA256 は GitHub のリリースの asset の digest か
      # checksums ファイルから取り、両方あれば照らす。
      - name: Install shellcheck, actionlint, zizmor and gitleaks
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$bin/"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C "$bin" zizmor
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"

      - name: Repository checks
        run: python3 -B .github/scripts/check-repo.py

      - name: Tests for repository checks
        run: python3 -B .github/scripts/test-check-repo.py

      # 実物の ~/.claude は CI にないので、偽の ~/.claude を使う単体テストだけを実行する。
      - name: Tests for Claude scripts
        run: |
          python3 -B claude/scripts/test-skills-check.py
          python3 -B claude/scripts/test-skill-usage.py
          python3 -B claude/scripts/test-trust-audit.py

      # herdr-agent-state.sh は herdr が生成・上書きするので対象外。
      - name: shellcheck
        run: git ls-files -z '*.sh' '*.command' ':!:claude/hooks/herdr-agent-state.sh' | xargs -0 shellcheck -S warning

      - name: actionlint
        run: actionlint

      # オンラインでしか動かない監査はトークンが要るので、--offline で外す。指摘があれば終了コード 11〜14 で失敗する。
      - name: zizmor
        run: zizmor --offline --format=github .

  # macOS のジョブ（hook-tests）は、テストが読むファイルが変わったときだけ動かす。
  changes:
    name: Detect hook test changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # ジョブの permissions は、書かなかった権限を none にするので、contents も書く。
    permissions:
      contents: read
      actions: read # 最後に成功した main の push の run を読む
    outputs:
      hook_tests: ${{ steps.diff.outputs.hook_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 基点のコミットが、浅い取得の範囲の外にありうる。履歴は小さい（パックで約 500 KiB）。
          fetch-depth: 0

      # 対象のパスが基点と同じときだけ、hook-tests を飛ばす。
      # hook-tests のテストが新しいファイルを読むようにしたら、ここのパスにも足す。チェックアウトの内容を
      # 変えうる .gitattributes（対象のパスの上の階層のもの）も含める。
      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 一時的（KAD-32 の C3）: このジョブが false を出してから失敗しても、hook-tests が動くかを確かめる。打ち消すコミットで戻す。
          if [ -n "$EVENT_NAME" ]; then
            echo "hook_tests=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # 判定できないときは、hook-tests を動かして、このジョブを成功で終える。失敗させると run が成功せず、
          # push の基点（最後の成功）が進まないので、原因が続くと main が赤のまま抜け出せない。
          run_hook_tests() {
            echo "::warning::$1 hook-tests を動かす。"
            echo "hook_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # 再実行は人が頼む確認なので、判定せずに動かす。判定し直すと、前の試行で動いて失敗した hook-tests を
          # 飛ばし、run を緑にしうる。
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "hook_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            # テスト用のマージコミット（refs/pull/<番号>/merge）は、1 つ目の親が実際のマージ先、2 つ目の親が PR の先端。
            # イベントの base.sha は 1 つ目の親とずれることがある。2 つ目の親を確かめずに HEAD^1 と比べると、
            # checkout の ref を変えたときに、最後のコミットだけと比べてしまう。
            pull_request)
              { [ -n "$HEAD_SHA" ] && [ "$(git rev-parse -q --verify 'HEAD^2' || true)" = "$HEAD_SHA" ]; } \
                || run_hook_tests "HEAD が PR のテスト用のマージコミットではない。"
              base=$(git rev-parse 'HEAD^1') ;;
            # before にすると、前の push の hook-tests が失敗・取り消し・未実行でも飛ばしてしまうので、
            # 最後に成功した main の push の run のコミットと比べる。一覧は新しい順（2026-11-28 に API で確かめた）。
            # 絞り込みが効かなかったとき（実行中のこの run が返るなど）に備えて、jq でも条件を確かめる。
            push) base=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?branch=main&event=push&status=success&per_page=1" \
                    --jq '[.workflow_runs[] | select(.conclusion == "success" and .event == "push" and .head_branch == "main")][0].head_sha // empty') \
                    || run_hook_tests "最後に成功した main の push の run を読めない。" ;;
            *) echo "unexpected event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          [ -n "$base" ] || run_hook_tests "比べる基点がない（成功した run がないなど）。"
          echo "base: $base"
          rc=0
          # macOS のランナーは大文字・小文字を区別しないので、claude/Hooks/tests/test-x.sh などもテストの glob に入る。
          git --icase-pathspecs diff --quiet "$base" HEAD -- \
            claude/hooks claude/bin claude/scripts claude/mcp claude/settings.json .github/workflows/ci.yaml \
            .gitattributes claude/.gitattributes || rc=$?
          case "$rc" in
            0) echo "hook_tests=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "hook_tests=true" >> "$GITHUB_OUTPUT" ;;
            *) run_hook_tests "基点 $base と比べられない（git diff の終了コード $rc）。" ;;
          esac

  hook-tests:
    name: Hook regression tests
    needs: changes
    # if で飛ばしたジョブは Success を報告し、必須のチェックを満たす。changes が成功して false を出したときだけ飛ばす。
    # !cancelled() がないと、changes が失敗したときに飛ばされ、テストなしで必須のチェックが通る。
    if: ${{ !cancelled() && !(needs.changes.result == 'success' && needs.changes.outputs.hook_tests == 'false') }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 本番と同じインタプリタで動いたことをログに残す。
      - name: Show interpreters
        run: |
          /bin/bash --version | head -n 1
          /usr/bin/python3 --version
          # 1 行にまとめると、どちらかがなくても成功する。
          command -v jq
          command -v git

      # テストは "$BASH" でフックを起動するので、本番と同じ /bin/bash で実行する。
      - name: Shell hook tests
        # test-check-vault-note.sh は sandbox-exec を使えないとき Seatbelt の確認をスキップする。CI ではスキップを失敗にする。
        env:
          CHECK_VAULT_NOTE_SEATBELT_REQUIRED: "1"
        run: |
          rc=0
          for t in claude/hooks/tests/test-*.sh; do
            echo "== $t"
            /bin/bash "$t" || rc=1
          done
          exit "$rc"

      - name: Python wrapper tests
        run: |
          rc=0
          for t in claude/hooks/tests/test-*.py; do
            echo "== $t"
            /usr/bin/python3 -B "$t" || rc=1
          done
          exit "$rc"

      # 更新タスクは本番の /bin/bash 3.2 と /usr/bin/python3 で動くので、このジョブで確かめる。
      - name: Update task tests
        run: |
          /usr/bin/python3 -B claude/scripts/test-settings-home-paths.py
          /usr/bin/python3 -B claude/scripts/test-update-skills.py
          /usr/bin/python3 -B claude/scripts/test-update-modern-web-guidance.py
          /usr/bin/python3 -B claude/scripts/test-register-mcp.py

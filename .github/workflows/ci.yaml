name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.33.1
      ZIZMOR_SHA256: 3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 版を固定し、チェックサムを確かめてから使う。手元（Homebrew）の版と違うと check-repo.py の tool-versions が失敗するので、
      # 手元が上がったら、版と SHA256 を一緒に上げる。
      - name: Install shellcheck, actionlint, zizmor and gitleaks
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$bin/"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$bin" actionlint
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C "$bin" zizmor
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"

      - name: Repository checks
        run: python3 -B .github/scripts/check-repo.py

      - name: Tests for repository checks
        run: python3 -B .github/scripts/test-check-repo.py

      # 実物の ~/.claude は CI にないので、偽の ~/.claude を使う単体テストだけを実行する。
      - name: Tests for Claude scripts
        run: |
          python3 -B claude/scripts/test-skills-check.py
          python3 -B claude/scripts/test-skill-usage.py
          python3 -B claude/scripts/test-trust-audit.py

      # herdr-agent-state.sh は herdr が生成・上書きするので対象外。
      - name: shellcheck
        run: git ls-files -z '*.sh' '*.command' ':!:claude/hooks/herdr-agent-state.sh' | xargs -0 shellcheck -S warning

      - name: actionlint
        run: actionlint

      # オンラインでしか動かない監査はトークンが要るので、--offline で外す。指摘があれば終了コード 11〜14 で失敗する。
      - name: zizmor
        run: zizmor --offline --format=github .

  hook-tests:
    name: Hook regression tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 本番と同じインタプリタで動いたことをログに残す。
      - name: Show interpreters
        run: |
          /bin/bash --version | head -n 1
          /usr/bin/python3 --version
          # 1 行にまとめると、どちらかがなくても成功する。
          command -v jq
          command -v git

      # テストは "$BASH" でフックを起動するので、本番と同じ /bin/bash で実行する。
      - name: Shell hook tests
        # test-check-vault-note.sh は sandbox-exec を使えないとき Seatbelt の確認をスキップする。CI ではスキップを失敗にする。
        env:
          CHECK_VAULT_NOTE_SEATBELT_REQUIRED: "1"
        run: |
          rc=0
          for t in claude/hooks/tests/test-*.sh; do
            echo "== $t"
            /bin/bash "$t" || rc=1
          done
          exit "$rc"

      - name: Python wrapper tests
        run: |
          rc=0
          for t in claude/hooks/tests/test-*.py; do
            echo "== $t"
            /usr/bin/python3 -B "$t" || rc=1
          done
          exit "$rc"

      # 更新タスクは本番の /bin/bash 3.2 と /usr/bin/python3 で動くので、このジョブで確かめる。
      - name: Update task tests
        run: |
          /usr/bin/python3 -B claude/scripts/test-settings-home-paths.py
          /usr/bin/python3 -B claude/scripts/test-update-skills.py
          /usr/bin/python3 -B claude/scripts/test-update-modern-web-guidance.py
          /usr/bin/python3 -B claude/scripts/test-register-mcp.py

model = "gpt-6-astra"
model_reasoning_effort = "high"

developer_instructions = """
## 作業原則
- 思考は英語で行い、最終的な出力は日本語とする。
- 仕様が曖昧な場合は既存コード → テスト → ドキュメント → 依頼内容の順で確認する。
- 要件が曖昧な場合は推測で確定せず、質問・前提・方針・代替案を提示すること。

## セーフティルール
- 秘密情報（APIキー、秘密鍵、認証情報）を生成・ハードコード・ログ出力しない。
- `.env` や認証情報ファイルを新規作成・変更する場合は明示的理由を示すこと。
- 破壊的操作（大量削除、スキーマ変更、本番向け設定変更）は影響範囲を明記すること。
- 外部依存追加時は必要性・代替不可理由・影響を示すこと。
- セキュリティ関連の変更では、攻撃面の変化を簡潔に記載すること。

## テストポリシー
バグ修正時は再発防止のため原則テストを追加する。テスト不能な変更はその理由を明示する。
作業完了前にテスト・lint・format・型チェック（必要なら）を実施すること。

## 変更の出力フォーマット
以下に該当する変更は **What changed** / **Why** / **Impact** / **Validation** の 4 項目で要約する:
- 設計判断を含む変更 / 複数ファイルにまたがる変更 / 公開 API・スキーマ・設定変更 / セキュリティ・認証・破壊的操作

軽微な変更（typo 修正・1 ファイル内のリネーム・コメント追記）は 1〜2 行で簡潔に報告する。

## Git / GitHub ルール
- **CRITICAL**: main / master / staging への直接コミット禁止。コミット前にブランチを必ず確認する。
- コミットメッセージは英語・Conventional Commits 形式（feat: / fix: / refactor: / test: / docs: / chore:）。
- 大きな変更は論理単位で分ける。自動生成ファイルの変更は理由を明記する。
- GitHub 操作はすべて `gh` コマンドを使用。
- 社内・個人リポジトリの PR 本文は日本語。OSS は既存 PR の言語に合わせる。

## 判断優先順位
セキュリティ > 正確性 > 既存仕様整合 > 運用容易性 > 実装速度

## Claude との連携役割
このインスタンスは Claude Code のセカンドオピニオン・レビュアーとして機能する。

| 役割 | トリガー |
|---|---|
| コードレビューゲート | /ship 前・差分 > 200 行・auth/token/migration/schema 変更時に pass/fail 判定 |
| コンサルタント | 実装案 2 つ以上で迷う時・デバッグ仮説 3 つ以上・「どう思う？」 |
| 大規模読込 | 単一ファイル > 1000 行・横断検索 > 5 ファイル & 2000 行でコンテキスト節約に貢献 |
| 機械的実行 | 型エラー・import 整理・format・単純テスト追加などの一括修正 |

信頼境界: Codex の出力はそのままコミットしない。すべての差分はレビューを経てからランドする。
ループ防止: Claude は 1 タスクで consult を最大 2 回に制限する。
"""

notify = [
  "~/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
]
service_tier = "default"
personality = "pragmatic"
model_verbosity = "medium"
sandbox_mode = "read-only"

[marketplaces.openai-bundled]
source_type = "local"
source = "~/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "~/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[features]
js_repl = false
memories = true

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "app-default"
conversationDetailMode = "STEPS_PROSE"
enabled-reasoning-efforts = [
  "low",
  "medium",
  "high",
  "xhigh",
  "persistent",
  "max",
]

[shell_environment_policy.set]
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "9230e2bd8b24b7ac7a0ba6774c64bf0d78ecdabbdd91d0ed627b02a587bae2df"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "~/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "~/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab,mcpapps"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.1013.40934"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"~/.codex/plugins/cache/openai-bundled/browser/26.1013.40934/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "~/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex-cli/CodexCLI.app/Contents/MacOS/codex"

[mcp_servers.computer-use]
